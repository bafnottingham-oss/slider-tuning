<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slider Tuning Guides</title>
<meta name="description" content="Unofficial tuning guides for the TITA Pro and Aura Sand Slim Pro sliders: setups, drawings, steps and feel simulators.">
<style>body{margin:0;background:#141619;color:#a3a7ad;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}@media (prefers-color-scheme:light){body{background:#eeede8;color:#5d6168}}</style>
</head>
<body>
<p>Loading the latest guide…</p>
<noscript><p><a href="app.html">Open the guide</a></p></noscript>
<script>
/* GitHub Pages lets browsers keep pages for up to 10 minutes. This small page never changes, and it always
   fetches the guide fresh, so anyone opening the link sees the latest version. */
fetch('app.html?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text();})
 .then(function(h){document.open();document.write(h);document.close();})
 .catch(function(){location.replace('app.html'+location.hash);});
</script>
</body>
</html>
